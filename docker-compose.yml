# Aimarket: Postgres → FastAPI (админка и оферта) → Telegram-бот.
#
# Бот забирает сообщения длинным опросом. Сайт — только /admin и /offer.
# PUBLIC_BASE_URL — адрес, который бот даёт в ссылке на оферту.
#
# Запуск из корня репозитория:
#   copy .env.example .env
#   docker compose up -d --build

name: aimarket

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-aimarket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (set in .env)}
      POSTGRES_DB: ${DB_NAME:-aimarket}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks: [internal]

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
