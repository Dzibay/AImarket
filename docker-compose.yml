# Aimarket: Postgres → FastAPI (админка и оферта) → Telegram-бот.
#
# Бот забирает сообщения длинным опросом. Сайт — только /admin и /offer.
# PUBLIC_BASE_URL — адрес, который бот даёт в ссылке на оферту.
#
# Запуск из корня репозитория:
#   copy .env.example .env
#   copy backend\.env.example backend\.env
#   copy bot\.env.example bot\.env
#   docker compose up -d --build

name: aimarket

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aimarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set in .env)}
      POSTGRES_DB: ${POSTGRES_DB:-aimarket}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-aimarket}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-aimarket}
      BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN:?BOT_INTERNAL_TOKEN is required (set in .env)}
      ROUTER_BASE_URL: ${ROUTER_BASE_URL:-https://router.cheap}
      ROUTER_ROOT_KEY: ${ROUTER_ROOT_KEY:-}
      USD_PRICE_KOPECKS: ${USD_PRICE_KOPECKS:-0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-}
      SYNC_INTERVAL_SEC: ${SYNC_INTERVAL_SEC:-60}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RECEIPT_EMAIL: ${YOOKASSA_RECEIPT_EMAIL:-}
      YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks: [internal]

  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required (set in .env)}
      BACKEND_URL: http://backend:8000
      BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN:?BOT_INTERNAL_TOKEN is required (set in .env)}
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
